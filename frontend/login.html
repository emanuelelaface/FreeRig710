<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeRig710 — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111820;
      color: #f2f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 390px);
      padding: 28px;
      border: 1px solid #34414d;
      border-radius: 16px;
      background: #1a232c;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    p { margin: 0 0 24px; color: #aebbc6; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 650;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #485866;
      border-radius: 10px;
      background: #0f151b;
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: 2px solid #73a9d8;
      outline-offset: 1px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #dce9f4;
      color: #111820;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Yaesu FT-710</h1>
    <p>Sign in to access the remote radio controls.</p>

    <form method="post" action="/ft710-login">
      <label for="username">Username</label>
      <input
        id="username"
        name="httpd_username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        required
        autofocus>

      <label for="password">Password</label>
      <input
        id="password"
        name="httpd_password"
        type="password"
        autocomplete="current-password"
        required>

      <input type="hidden" name="httpd_location" value="/">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
